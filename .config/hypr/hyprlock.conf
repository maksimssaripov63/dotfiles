background {
    monitor =
    path = screenshot # Делает размытый снимок вашего текущего экрана на ходу!
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vignette = true
    vignette_darkness = 0.5
}

# Виджет больших часов по центру экрана
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgb(38, 38, 38)
    inner_color = rgb(16, 16, 16)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    placeholder_text = <i>Введите пароль...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

# Текстовый виджет часов над полем ввода
label {
    monitor =
    text = $TIME
    color = rgb(255, 255, 255)
    font_size = 64
    font_family = FiraCode Nerd Font Bold
    position = 0, 100
    halign = center
    valign = center
}

